name: GoWild Seed

# Seed next weekend's flight schedules every Monday morning
on:
  schedule:
    - cron: '7 17 * * 1'  # Monday 5:07pm UTC = Monday 10:07am PT
  workflow_dispatch:
    inputs:
      friday_date:
        description: 'Friday date (YYYY-MM-DD), leave blank for next Friday'
        required: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize DB if needed
        run: python monitor.py init

      - name: Seed flight schedules
        run: |
          if [ -n "${{ github.event.inputs.friday_date }}" ]; then
            python monitor.py seed "${{ github.event.inputs.friday_date }}"
          else
            python monitor.py seed
          fi

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gowild_monitor.db
          git diff --cached --quiet || git commit -m "chore: seed weekend flight schedules [skip ci]"
          git push
