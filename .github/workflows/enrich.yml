name: GoWild Enrich (OpenSky flight numbers)

# Once a day, query OpenSky for the last few days of Frontier departures
# and assign / propagate flight numbers onto matching schedules.
# Splitting this off from dispatch keeps the every-2h dispatch run cheap
# (~30s) — enrichment is the expensive step (~20 min of OpenSky calls).
on:
  schedule:
    - cron: '15 4 * * *'  # 04:15 UTC, after OpenSky's nightly batch lands
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize DB if needed
        run: python monitor.py init

      - name: Enrich flight numbers (OpenSky)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python monitor.py enrich --days-back 3

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gowild_monitor.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit."
            exit 0
          fi
          git commit -m "chore: enrich flight numbers via OpenSky [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push conflict, rebasing on remote..."
            sleep 5
            cp gowild_monitor.db /tmp/enriched.db
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/enriched.db gowild_monitor.db
            git add gowild_monitor.db
            git commit -m "chore: enrich flight numbers via OpenSky [skip ci]" || true
          done
