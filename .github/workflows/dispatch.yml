name: GoWild Dispatch

# Catch-up model: each run checks ALL flights past T-24h.
# Run every 2 hours, every day — full week coverage.
# GitHub Actions may skip some runs — the catch-up logic handles gaps.
on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2h, every day
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize DB if needed
        run: python monitor.py init

      - name: Run dispatcher
        run: python monitor.py dispatch

      - name: Enrich flight numbers (OpenSky)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        continue-on-error: true  # best-effort; no-ops silently if secrets aren't set
        run: python monitor.py enrich --days-back 7

      - name: Commit database changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gowild_monitor.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit."
            exit 0
          fi
          git commit -m "chore: update availability data [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push conflict, rebasing on remote..."
            sleep 5
            cp gowild_monitor.db /tmp/checked.db
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/checked.db gowild_monitor.db
            git add gowild_monitor.db
            git commit -m "chore: update availability data [skip ci]" || true
          done
